# fly.toml app configuration file generated for momentsearch-wispy-silence-981 on 2026-07-29T22:58:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'momentsearch-wispy-silence-981'
primary_region = 'iad'

[build]
[deploy]
  release_command = "sh -c 'CLIP_SERVICE_URL= python -m src.seed'"

[env]
  CLIP_SERVICE_URL = 'http://clip.process.momentsearch-wispy-silence-981.internal:8001'

[processes]
  api = 'uvicorn src.app:app --host 0.0.0.0 --port 8000'
  clip = 'uvicorn src.clip_service:app --host :: --port 8001'
  worker = 'python -m src.worker'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['api']

[[restart]]
  policy = 'always'
  retries = 10
  processes = ['worker', 'clip']

[[restart]]
  policy = 'on-failure'
  retries = 10
  processes = ['api']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['api']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  processes = ['worker']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  processes = ['clip']
